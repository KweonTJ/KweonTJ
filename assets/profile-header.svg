<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Kwon Taek Ju — Robotics Engineer</title>
  <desc id="description">From simulation to real-world motion. A teal quadruped line drawing on a dark navy engineering grid.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#203047" stroke-width="1"/>
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B2D"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect x="720" width="480" height="360" fill="url(#grid)"/>
    <path d="M0 0H1200" stroke="#5EEAD4" stroke-width="6"/>
