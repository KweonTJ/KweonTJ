    <text x="56" y="157" fill="#F1F5F9" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Kwon Taek Ju</text>
    <text x="59" y="207" fill="#C5D2E3" font-family="Arial, Helvetica, sans-serif" font-size="25">From simulation to real-world motion.</text>
    <path d="M59 244H111" stroke="#5EEAD4" stroke-width="3"/>
    <text x="59" y="295" fill="#A8B9CD" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">CONTROL / LEARNING / PERCEPTION</text>
    <circle cx="956" cy="171" r="113" stroke="#284456"/>
    <circle cx="956" cy="171" r="85" stroke="#284456" stroke-dasharray="4 8"/>
    <path d="M787 273H1128" stroke="#516079" stroke-width="2" stroke-linecap="round"/>
